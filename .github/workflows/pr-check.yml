name: PR Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      - run: uv run ruff check src
      - run: uv run ruff format src --check
      - run: uv run mypy src --ignore-missing-imports

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gullydream11_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/gullydream11_test"
      REDIS_URL: "redis://localhost:6379/0"
      JWT_SECRET_KEY: "test-secret-key-for-ci-only"
      JWT_ALGORITHM: "HS256"
      ENVIRONMENT: "test"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      - name: Run migrations
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/gullydream11_test"
          uv run alembic upgrade head
      - run: uv run pytest --tb=short -q

  frontend-check:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://api.example.com/api"
          NEXT_PUBLIC_APP_NAME: "GullyDream11"
          NEXT_PUBLIC_APP_URL: "https://example.com"

  migration-check:
    name: Migration Safety Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gullydream11_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/gullydream11_migration"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      - name: Test migration reversibility
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/gullydream11_migration"
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

  openapi-sync:
    name: OpenAPI Types Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --dev
      - run: cd frontend && npm ci
      - run: uv run python scripts/export-openapi.py
      - run: cd frontend && npx openapi-typescript ../openapi.json -o src/lib/api/types.ts
      - name: Check for uncommitted type changes
        run: |
          if git diff --exit-code frontend/src/lib/api/types.ts; then
            echo "Types are in sync"
          else
            echo "ERROR: OpenAPI types are out of sync. Run 'npm run generate-types' and commit."
            exit 1
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0
