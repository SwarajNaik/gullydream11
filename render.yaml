# Render Blueprint — deploy backend as a free web service
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: gullydream11-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    preDeployCommand: "alembic upgrade head"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: ADMIN_EMAILS
        sync: false
      - key: DEBUG
        value: "false"
      - key: API_HOST
        value: "0.0.0.0"
      - key: API_PORT
        value: "8000"
      - key: API_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ENVIRONMENT
        value: "production"
      - key: LOG_FORMAT
        value: "json"
      - key: LOG_LEVEL
        value: "INFO"
      - key: CRICKET_API_KEY
        sync: false
      - key: CRICKET_API_URL
        value: "https://api.cricapi.com/v1"
    healthCheckPath: /health
